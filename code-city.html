<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CODE CITY</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#39ff7a;
    font:12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    -webkit-user-select:none;user-select:none;touch-action:none;letter-spacing:.06em}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  #ui{position:fixed;inset:0;pointer-events:none;transition:opacity .35s;text-shadow:0 0 7px rgba(57,255,122,.6)}
  #ui.hidden{opacity:0}
  #ui.hidden *{pointer-events:none!important}
  #stats{position:absolute;left:14px;top:12px;white-space:pre}
  #toggles{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  #toggles button,#tbtns button{pointer-events:auto;background:rgba(0,14,5,.5);border:1px solid rgba(57,255,122,.35);
    color:inherit;font:inherit;letter-spacing:inherit;text-shadow:inherit;padding:3px 9px;cursor:pointer;border-radius:0}
  #toggles button:hover{background:rgba(57,255,122,.16)}
  #hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;padding:0 16px;opacity:.92;transition:opacity 1.6s}
  #hint.fade{opacity:0}
  #intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;
    font-size:clamp(26px,5vw,84px);transition:opacity 1.9s ease;z-index:5;text-shadow:0 0 12px rgba(57,255,122,.8)}
  #intro.gone{opacity:0;pointer-events:none}
  #introbox{width:15ch;white-space:pre}
  #cursor{display:inline-block;width:.6em;height:1.05em;background:#39ff7a;margin-left:.1em;vertical-align:-.16em;
    animation:blink .9s steps(1) infinite;box-shadow:0 0 12px #39ff7a}
  @keyframes blink{50%{opacity:0}}
  #touch{display:none}
  .touch #touch{display:block}
  .touch #hint{bottom:auto;top:12px;left:150px;right:170px}
  #stick{position:fixed;left:26px;bottom:26px;width:120px;height:120px;border:1px solid rgba(57,255,122,.35);
    border-radius:50%;pointer-events:auto;background:rgba(0,20,6,.25)}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;
    background:rgba(57,255,122,.3);border:1px solid rgba(57,255,122,.6)}
  #tbtns{position:fixed;right:20px;bottom:30px;display:flex;flex-direction:column;gap:10px}
  #tbtns button{width:78px;height:44px}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:#000;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="stats"></div>
  <div id="toggles">
    <button id="tRain"></button>
    <button id="tTraffic"></button>
    <button id="tGlitch"></button>
    <button id="tCode"></button>
    <button id="tSound"></button>
    <button id="tMusic"></button>
  </div>
  <div id="hint">WASD move &middot; MOUSE look (click) &middot; SPACE launch &middot; SHIFT boost &middot; Q/E down/up &middot; F bullet-time &middot; G recompile &middot; C cinematic &middot; R new seed &middot; H hide UI</div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns"><button id="bBoost">BOOST</button><button id="bTime">TIME</button><button id="bCine">CINE</button></div>
  </div>
</div>
<div id="intro"><div id="introbox"><span id="typed"></span><span id="cursor"></span></div></div>
<div id="err">This needs WebGL2. Try a current Chrome, Edge, Firefox or Safari.</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

// ───────────────────────── constants + helpers ─────────────────────────
const CELL = 100, ROAD = 24, ASPH = 16;          // road pitch, right-of-way, asphalt width
const CHUNK_CELLS = 2, CHUNK = CELL * CHUNK_CELLS;
const RC = 6;                                     // chunk radius around the camera
const FOG_FAR = 1150;                             // everything is fully fogged before the load edge
const CLOUD_Y = 620, DECK_TOP = 930, CLOUD_TOP = 1750;   // the clouds: the base, the top of the flat deck, the top of the highest tower
const MACH = 340;                                 // boost top speed, units (metres) per second
const CEIL = 3200;                                // flight ceiling
const FAR_R = 44, FAR_SNAP = 8;                   // far-field radius and re-centre step, in cells
const SPIRE_GRID = 18;                            // one landmark spire at most per 18 x 18 cells
let EPOCH = 0;                                    // generation of the city; a recompile wave moves it forward
const TAU = Math.PI * 2;

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const $ = id => document.getElementById(id);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashInt(a, b, c) {
  let h = Math.imul(a | 0, 0x9E3779B1) ^ Math.imul(b | 0, 0x85EBCA77) ^ Math.imul(c | 0, 0xC2B2AE3D);
  h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; h = Math.imul(h, 0x297A2D39); h ^= h >>> 15;
  return h >>> 0;
}
const hash01 = (a, b, c) => hashInt(a, b, c) / 4294967296;

// ───────────────────────── seed + settings ─────────────────────────
let SEED = (() => {
  const m = /seed=([0-9a-f]{1,8})/i.exec(location.hash);
  return m ? parseInt(m[1], 16) >>> 0 : (Math.random() * 4294967296) >>> 0;
})();
const seedHex = () => SEED.toString(16).toUpperCase().padStart(8, '0');

const GLITCH_NAMES = ['OFF', 'LOW', 'MED', 'HIGH'], GLITCH_GAP = [1e9, 13, 6.5, 2.6];
const CODE_NAMES = ['LOW', 'MED', 'HIGH'], CODE_MUL = [0.15, 0.45, 1.0];
const S = { rain: true, traffic: true, glitch: 0, code: 1, sound: true, music: true };

// smooth value noise over cell coordinates, used for district height and style
function vnoise(x, z, salt) {
  const xi = Math.floor(x), zi = Math.floor(z);
  let fx = x - xi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  const s = SEED ^ salt;
  const a = hash01(s, xi, zi), b = hash01(s, xi + 1, zi), c = hash01(s, xi, zi + 1), d = hash01(s, xi + 1, zi + 1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fz);
}

// ───────────────────────── glyph atlas (8x8, mirrored like the film) ─────────────────────────
function makeGlyphAtlas(maxAniso) {
  const N = 8, C = 64, cv = document.createElement('canvas');
  cv.width = cv.height = N * C;
  const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
  const kata = 'ｦｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾜ';
  const chars = (kata + '0123456789:.=*+-<>|"').slice(0, N * N).padEnd(N * N, '7');
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 46px "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","MS Gothic","Noto Sans Mono CJK JP","Noto Sans JP",monospace';
  for (let i = 0; i < N * N; i++) {
    const ch = chars[i], cx = (i % N + 0.5) * C, cy = (Math.floor(i / N) + 0.5) * C;
    const w = Math.max(8, g.measureText(ch).width), sx = clamp(40 / w, 0.7, 1.7);
    g.save(); g.translate(cx, cy + 2); g.scale(-sx, 1); g.fillText(ch, 0, 0); g.restore();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true; tex.anisotropy = Math.min(8, maxAniso);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

// ───────────────────────── renderer + shared uniforms ─────────────────────────
const canvas = $('gl');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
} catch (e) { /* handled below */ }
if (!renderer || !renderer.capabilities.isWebGL2) { $('err').style.display = 'flex'; throw new Error('WebGL2 required'); }
renderer.autoClear = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // the final pass encodes
renderer.toneMapping = THREE.NoToneMapping;               // ACES runs in the composite pass
const HDR = (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'))
  ? THREE.HalfFloatType : THREE.UnsignedByteType;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
if (IS_TOUCH) {
  document.body.classList.add('touch');
  $('hint').textContent = 'STICK move \u00b7 DRAG look \u00b7 BOOST \u00b7 TIME bullet-time \u00b7 CINE cinematic';
}

const U = {
  uTime: { value: 0 }, uRTime: { value: 0 }, uMirror: { value: 1 },
  uFogCol: { value: new THREE.Vector3(0.017, 0.027, 0.038) },
  uFogDen: { value: 0.0009 }, uFogH: { value: 0.0022 }, uFogFar: { value: FOG_FAR },
  uCloud: { value: 0 }, uFlash: { value: 0 }, uFlashDir: { value: new THREE.Vector3(0.5, 0.6, 0.3).normalize() },
  uGlyph: { value: makeGlyphAtlas(renderer.capabilities.getMaxAnisotropy()) },
  uCode: { value: 1 },
  uGlitchA: { value: new THREE.Vector4(1e9, 1e9, 0, 0) }, uGlitchB: { value: new THREE.Vector4(1e9, 1e9, 0, 0) },
  uRes: { value: new THREE.Vector2(1, 1) }, uRefl: { value: null },
  uCamVel: { value: new THREE.Vector3() }, uBoost: { value: 0 }, uSlow: { value: 0 },
  uAbove: { value: 0 }, uFlashPos: { value: new THREE.Vector3() },
  uNear: { value: new THREE.Vector4() }, uWave: { value: new THREE.Vector4(1, 0, 0, 0) },
  uDark: { value: new THREE.Vector4(0, 1, 0, 0) },
  uFold: { value: new THREE.Vector4(0, 300, 0, 0) },
  uPL: { value: [0, 1, 2, 3, 4, 5].map(() => new THREE.Vector4()) }, uPLc: { value: [0, 1, 2, 3, 4, 5].map(() => new THREE.Vector4()) }, uPLn: { value: 0 },
  uInA: { value: new THREE.Vector3(1e9, 1e9, 1e9) }, uInB: { value: new THREE.Vector3(-1e9, -1e9, -1e9) },
  uHoleA: { value: [new THREE.Vector3(1e9, 1e9, 1e9), new THREE.Vector3(1e9, 1e9, 1e9)] }, uHoleB: { value: [new THREE.Vector3(-1e9, -1e9, -1e9), new THREE.Vector3(-1e9, -1e9, -1e9)] },
  uBuild: { value: new THREE.Vector4() }, uRainK: { value: 1 }, uNF: { value: new THREE.Vector2(0.5, 60000) }, tDepth: { value: null }, uCover: { value: null }, uNoise3: { value: null },
};
const mkMat = (vs, fs, extra, opts) => new THREE.ShaderMaterial(Object.assign({
  uniforms: Object.assign({}, U, extra || {}), vertexShader: '#define VS\n' + GL_COMMON + vs, fragmentShader: GL_COMMON + fs,
}, opts || {}));

// ───────────────────────── GLSL shared by every scene shader ─────────────────────────
const GL_COMMON = /* glsl */`
precision highp sampler3D;
uniform float uTime, uRTime, uMirror, uFogDen, uFogH, uFogFar, uCloud, uFlash, uCode, uBoost, uSlow, uAbove, uRainK;
uniform vec3 uFogCol, uFlashDir, uCamVel, uFlashPos;
uniform vec2 uRes, uNF;
uniform vec4 uWave;                                 // recompile front: direction x, z, position along it, active
uniform vec4 uBuild;                                // the world being built: centre x, z, radius of the built part, active
uniform vec4 uDark;                                 // the blackout wave: direction x, z, the place of its front along it, the width of the dark band (0 = no wave)
uniform vec4 uFold;                                 // the city fold: hinge z, radius, angle now (0 to PI), on
uniform vec4 uPL[6], uPLc[6]; uniform int uPLn;     // local lights: place + reach, colour + zone (0 outdoors, 1 indoors, 2 both)
uniform vec3 uInA, uInB;                            // the box that counts as indoors: no rain falls in it, and lights of one zone do not reach the other
uniform vec3 uHoleA[2], uHoleB[2];                  // boxes where the walls of buildings are cut away: a doorway, a hatch
uniform sampler2D uGlyph, uCover, tDepth;
uniform sampler3D uNoise3;
const float CLOUD_Y = 620.0, CLOUD_TOP = 1750.0;    // the clouds: the base, and the top of the highest tower
const vec3 MOON_DIR = vec3(0.4082, 0.4082, -0.8165);
const vec3 C_LAMP = vec3(1.0, 0.55, 0.20);          // sodium street light
const vec3 C_MOON = vec3(0.62, 0.74, 1.0);          // moonlight
const vec3 C_FLASH = vec3(0.70, 0.80, 1.0);         // lightning
const vec3 C_GLOW = vec3(1.0, 0.60, 0.34);          // the city's light on the cloud base
const vec3 C_CODE = vec3(0.16, 1.0, 0.36), C_CODE_HI = vec3(0.75, 1.0, 0.85);   // the code stays green
float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }

// clear night air: haze at the horizon, dark at the zenith
vec3 nightSky(float y){ return mix(vec3(0.013, 0.021, 0.040), vec3(0.0014, 0.0026, 0.0068), smoothstep(-0.05, 0.5, y)); }
// colour of the air in a direction: what distant things fade into. The horizon equals the fog colour, so the far fade has no seam.
vec3 skyGrad(float y){
  vec3 g = mix(uFogCol, uFogCol * 0.45 + C_GLOW * 0.011, smoothstep(0.0, 0.6, y));   // under the clouds: haze, then the lit cloud base
  g = mix(g, nightSky(y), uAbove);
  return g * (1.0 + uFlash * 1.3 * (1.0 - uAbove));
}
// while the world is built outward from a point: how far the front has passed p, in metres. A large number when nothing is being built
float built(vec2 p){ return uBuild.w > 0.5 ? uBuild.z - distance(p, uBuild.xy) : 1e6; }
// the share of its light that the blackout wave leaves a lamp at p. j (0..1) shifts single lamps against each other, so they go one by one
float lightsOn(vec2 p, float j){
  if (uDark.w <= 0.0) return 1.0;
  float d = uDark.z - dot(p, uDark.xy) + (j - 0.5) * 90.0;                    // > 0: the front has passed this place
  if (d < -40.0 || d > uDark.w + 70.0) return 1.0;
  float fl = step(0.45, fract(uRTime * 21.0 + j * 13.0));                     // a tube that stutters
  if (d < 0.0) return mix(1.0, fl, (d + 40.0) / 40.0 * 0.85);                 // it stutters before it goes out,
  if (d > uDark.w) return mix(fl * 0.7, 1.0, (d - uDark.w) / 70.0);           // and again when it comes back
  return 0.0;
}
// the city fold. Beyond the line z = uFold.x the world bends up and over: a pipe of radius uFold.y, then straight on along its tangent.
// p is the point. sa is the z that decides the angle: p.z itself, or the middle of a thing that must stay rigid. th returns the angle there
vec3 foldP(vec3 p, float sa, out float th){
  th = 0.0;
  float d = sa - uFold.x;
  if (uFold.w < 0.5 || d <= 0.0) return p;
  float R = uFold.y; th = min(d / R, uFold.z);
  float run = d - th * R + (p.z - sa), sn = sin(th), cs = cos(th);            // run: the way along the ground from the point of the curve at th
  return vec3(p.x, R - R * cs + sn * run + cs * p.y, uFold.x + R * sn + cs * run - sn * p.y);
}
bool indoors(vec3 p){ return all(greaterThan(p, uInA)) && all(lessThan(p, uInB)); }
// the light of the local lamps on a surface at p with the normal n
vec3 localLight(vec3 p, vec3 n){
  vec3 sum = vec3(0.0); float ins = uPLn > 0 && indoors(p) ? 1.0 : 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= uPLn) break;
    if (uPLc[i].w < 1.5 && abs(uPLc[i].w - ins) > 0.5) continue;
    vec3 d = uPL[i].xyz - p; float r = length(d), a = max(1.0 - r / uPL[i].w, 0.0);
    sum += uPLc[i].rgb * a * a * max(dot(n, d / max(r, 1e-3)) * 0.8 + 0.2, 0.0);
  }
  return sum;
}
// the cloud layer, 0..1 without the fine erosion. The ray march, the lights and the script all read this one field.
float cloudBase(vec3 p, float lod){
  float y = p.y - CLOUD_Y;
  if (y <= 0.0 || p.y >= CLOUD_TOP) return 0.0;
  vec2 w = p.xz + uTime * vec2(9.0, 3.5);                                    // wind
  vec2 cv = texture2D(uCover, w / 16000.0).rg;                               // r = how much cloud, g = how thick the deck is
  float cov = smoothstep(0.22, 0.70, cv.r), deck = mix(150.0, 310.0, cv.g);
  float tw = smoothstep(0.55, 0.80, texture2D(uCover, w / 5300.0 + 0.37).g) * cov;   // cloud type: 0 = flat deck, 1 = a storm tower (the same map, read smaller)
  float top = deck + 950.0 * tw;                                             // the top of the cloud here, in metres above the base
  float prof = smoothstep(0.0, 18.0, y) * (1.0 - smoothstep(top * mix(0.35, 0.5, tw), top, y));   // density over height
  float inT = tw * smoothstep(deck * 0.7, deck * 1.5, y);                    // how much this point is tower, not deck
  float need = mix((1.0 - cov) * 0.9 + 0.08, 0.5, inT);                      // what the noise must pass: little in the closed deck, much in a tower, so the noise cuts it into heads
  if (prof <= need) return 0.0;                                              // no noise can lift this point into cloud
  float n = texture(uNoise3, vec3(w.x, p.y * 1.3, w.y) / 1500.0).r;
  return clamp((mix(n, 0.6, lod) * prof - need) * mix(3.0, 2.2, inT), 0.0, 1.0);
}
// how much of a light at p reaches the camera through the clouds (a few samples along the way)
float cloudVis(vec3 p){
  vec3 ro = cameraPosition, d = p - ro;
  if (max(ro.y, p.y) < CLOUD_Y || min(ro.y, p.y) > CLOUD_TOP) return 1.0;
  float iy = 1.0 / (abs(d.y) < 1e-3 ? 1e-3 : d.y);
  float sa = clamp((CLOUD_Y - ro.y) * iy, 0.0, 1.0), sb = clamp((CLOUD_TOP - ro.y) * iy, 0.0, 1.0);
  float s0 = min(sa, sb), s1 = max(sa, sb), od = 0.0;
  if (abs(d.y) < 1e-3) { s0 = 0.0; s1 = 1.0; }
  for (int i = 0; i < 5; i++) od += cloudBase(ro + d * mix(s0, s1, (float(i) + 0.5) / 5.0), 0.0);
  return exp(-od * 0.2 * length(d) * (s1 - s0) * 0.04);
}
#ifndef VS
// glows are drawn after the clouds, without a depth buffer, so they test the scene depth themselves
bool hidden(){
  if (uMirror < 0.0) return false;
  float zs = texture2D(tDepth, gl_FragCoord.xy / uRes).r, k = uNF.y - uNF.x;
  float ds = uNF.x * uNF.y / (uNF.y - zs * k), df = uNF.x * uNF.y / (uNF.y - gl_FragCoord.z * k);
  return df > ds * 1.003 + 0.04;
}
#endif
vec3 sceneLight(vec3 n, float y){
  float up = n.y * 0.5 + 0.5;
  return mix(uFogCol * 1.5, uFogCol * 1.9 + C_GLOW * 0.05 * (1.0 - uAbove) + C_MOON * 0.05 * uAbove, up)   // the street below, the lit clouds or the moon above
       + C_LAMP * exp(-max(y, 0.0) / 14.0) * 0.10
       + C_FLASH * uFlash * (0.2 + 0.8 * max(dot(n, uFlashDir), 0.0));
}
// what a wet or glassy surface mirrors in direction r
vec3 envCol(vec3 r){ return skyGrad(r.y) + C_MOON * 0.6 * uAbove * pow(max(dot(r, MOON_DIR), 0.0), 60.0); }
// distance fog + ground mist (exponential height fog) + hard fade before the edge of the loaded city
vec3 applyFog(vec3 col, vec3 wp){
  vec3 rd = wp - cameraPosition; float d = length(rd); rd /= max(d, 1e-4);
  const float b = 0.018;
  float k = rd.y * uMirror * b;
  float f = abs(k) < 1e-5 ? d : (1.0 - exp(-d * k)) / k;
  float od = uFogDen * d + uFogH * exp(-abs(cameraPosition.y) * b) * f;
  float fog = 1.0 - exp(-od);
  fog = max(fog, smoothstep(uFogFar * 0.6, uFogFar, length(wp.xz - cameraPosition.xz)));   // by ground distance: from high up the whole loaded city shows
  return mix(col, skyGrad(rd.y), fog);
}
// one glyph from the 8x8 atlas. cuv is 0..1 inside the cell, gradients are passed in so cell edges do not break mip selection.
float glyph(vec2 cuv, float idx, vec2 ddx, vec2 ddy){
  idx = floor(mod(idx, 64.0));
  vec2 g = vec2(mod(idx, 8.0), floor(idx / 8.0));

// ───────────────────────── wet ground: roads, puddles, ripples, planar reflection ─────────────────────────

const GROUND_FS = FOLD_F + /* glsl */`

function instGeo(base, cap, layout) {
  const g = new THREE.InstancedBufferGeometry();
  g.index = base.index;
  g.setAttribute('position', base.attributes.position);
  if (base.attributes.normal) g.setAttribute('normal', base.attributes.normal);
  if (base.attributes.aPart) g.setAttribute('aPart', base.attributes.aPart);
  for (const [name, n] of layout) {
    const a = new THREE.InstancedBufferAttribute(new Float32Array(cap * n), n);
    a.setUsage(THREE.DynamicDrawUsage); g.setAttribute(name, a);
  }
  g.instanceCount = 0;
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e9);
  return g;
}
function addMesh(geo, mat, order) {
  const m = new THREE.Mesh(geo, mat);

  $('tSound').textContent = '[5] SOUND ' + (S.sound ? 'ON' : 'OFF');
  $('tMusic').textContent = '[6] MUSIC ' + (S.music ? 'ON' : 'OFF');
  U.uCode.value = CODE_MUL[S.code]; matGround.uniforms.uRainOn.value = S.rain ? 1 : 0; matGround.uniforms.uTraffic.value = S.traffic ? 1 : 0;
}
function toggle(k) {
  if (k === 'rain') S.rain = !S.rain;
  else if (k === 'traffic') S.traffic = !S.traffic;
  else if (k === 'glitch') { S.glitch = (S.glitch + 1) % 4; fx.nextGlitch = Math.min(fx.nextGlitch, GLITCH_GAP[S.glitch] * 0.5); }
  else if (k === 'sound') { S.sound = !S.sound; if (AC) aSet(AU.nodes.out.gain, S.sound ? 1 : 0, 0.05); }
  else if (k === 'music') S.music = !S.music;                     // updateAudio() sets its level
  else S.code = (S.code + 1) % 3;
  refreshUI();
}
for (const [id, k] of [['tRain', 'rain'], ['tTraffic', 'traffic'], ['tGlitch', 'glitch'], ['tCode', 'code'], ['tSound', 'sound'], ['tMusic', 'music']])
  $(id).addEventListener('click', e => { toggle(k); e.currentTarget.blur(); });

// start a few blocks before the tallest district nearby, on a road, flying toward it
function placeStart() {
  let best = -1, bx = 0, bz = 0;
  for (let iz = -10; iz <= 10; iz++) for (let ix = -10; ix <= 10; ix++) {
    const v = vnoise(ix / 5, iz / 5, 0x51); if (v > best) { best = v; bx = ix; bz = iz; }
  }
  const iz = bz - 4, y = clamp(Math.min(getCell(bx, iz).maxH, getCell(bx - 1, iz).maxH) + 14, 40, 300);
  P.pos.set(bx * CELL, y, iz * CELL + 50); P.vel.set(0, 0, 0);
  P.yaw = P._yaw0 = Math.PI; P.pitch = P._pitch0 = 0; P.roll = 0; P.boost = 0;
  camera.position.copy(P.pos); camera.rotation.set(0, P.yaw, 0, 'YXZ');
}
function newSeed() {
  SEED = (Math.random() * 4294967296) >>> 0;
  try { history.replaceState(null, '', '#seed=' + seedHex()); } catch (e) { /* file:// in some browsers */ }
  resetCity(); placeStart(); resetTraffic(P.pos.x, P.pos.z); startBuild(P.pos.x, P.pos.z, 420);
  fx.slots[0] = fx.slots[1] = null; fx.scan = 1; fx.tear = 1; fx.ca = 0.008; chirp(6);
  if (cineOn) { cine.pan = 0; startCine(); }
}

// ───────────────────────── intro ─────────────────────────
let started = false, fade = 0;
(async () => {
  const wait = ms => new Promise(r => setTimeout(r, ms)), el = $('typed');
  await wait(900);
  for (const ch of 'Wake up now...') { el.textContent += ch; await wait(90 + Math.random() * 110); }
  await wait(1300);
  $('intro').classList.add('gone');
  started = true; fx.nextGlitch = 2.8; fx.force = 'dissolve';
  setTimeout(() => { if (build.auto) { build.auto = false; build.speed = 420; } }, 700);   // the city builds itself as the picture fades in
  if (!MOVE_KEYS.some(k => keys[k])) setCine(true, true);        // already flying by hand: leave the controls alone
  setTimeout(() => $('hint').classList.add('fade'), 5000);
})();

// ───────────────────────── main loop ─────────────────────────
let timeRate = 1;                                 // the pace of the world: 1 runs, 0 holds still, below 0 runs backwards
let fovAdd = 0;                                   // degrees a tour adds to the lens angle: below 0 is a longer lens
let fogAlt = null;                                // a height to take the fog from, in place of the height of the camera
let last = performance.now(), worldT = 0, rainT = 0, realT = 0, fpsT = last, fpsN = 0, fps = 60, lowN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = clamp((now - last) / 1000, 0.001, 0.05); last = now;
  realT += rdt; fpsN++;
  if (now - fpsT >= 500) {
    fps = fpsN * 1000 / (now - fpsT); fpsT = now; fpsN = 0;
    $('stats').textContent = `FPS ${fps.toFixed(0)}\nSEED ${seedHex()}\nMACH ${(P.speed / MACH).toFixed(2)}`
      + (cineOn ? '\nCINEMATIC' : '') + (P.slow > 0.5 ? '\nBULLET TIME' : '');
    // hold 60 FPS: if the frame rate stays low, render fewer pixels
    if (started && realT > 8 && !document.hidden && fps < 48) { if (++lowN >= 3 && quality > 0.56) { quality = Math.max(0.55, quality * 0.85); lowN = 0; resize(); } }
    else lowN = 0;
  }
  const fu = matFinal.uniforms;
  fu.uTime.value = realT;
  if (replay.left > 0) {                                          // deja vu: the world holds still while stored frames run again
    fu.uScan.value = 0.55; fu.uCA.value = 0.006; fu.uTear.value = 0;
    renderScene();
    if (replay.left === 0) { fx.scan = 0.6; fx.tear = 0.5; }
    return;
  }
  P.slow = damp(P.slow, (keys.KeyF || touch.slow) ? 1 : 0, 7, rdt);
  const dt = rdt * lerp(1, 0.1, P.slow) * timeRate, cdt = rdt * lerp(1, cineOn ? 0.22 : 0.4, P.slow);   // world at 10%, the flyer keeps some pace
  worldT += dt; rainT += rdt * lerp(1, 0.012, P.slow) * timeRate;            // rain all but freezes
  if (cineOn) stepCine(cdt, rdt); else stepManual(cdt, rdt);
  const vs = cineOn ? 1 : cdt / rdt;
  P.speed = P.vel.length();
  if (P.boomArmed && P.speed > MACH * 0.92) { P.boomArmed = false; sonicBoom(); }
  if (P.speed < MACH * 0.6) P.boomArmed = true;
  const fovT = 72 + 42 * P.boost * smooth(0.12, 0.9, P.speed / MACH) - 7 * P.slow + fovAdd;
  if (Math.abs(fovT - camera.fov) > 0.02) { camera.fov = damp(camera.fov, fovT, 5, rdt); camera.updateProjectionMatrix(); }
  P.shake = Math.max(0, P.shake - rdt * 1.8);
  const shk = 0.03 * P.shake * P.shake;                           // a hit shakes the camera; flight itself is smooth
  if (shk > 1e-5) {
    camera.rotateX(shk * (Math.sin(realT * 47.1) + Math.sin(realT * 83.3 + 1.3)));
    camera.rotateY(shk * (Math.sin(realT * 53.7 + 2.1) + Math.sin(realT * 71.9)));
    camera.rotateZ(shk * 0.6 * Math.sin(realT * 39.3 + 0.7));
  }
  camera.updateMatrixWorld();

  const px = P.pos.x, pz = P.pos.z;
  updateChunks(px, pz, started ? 4 : 400);
  updateFar(px, pz);
  updateTraffic(dt, worldT, px, pz, P.vel.x, P.vel.z);
  updateWave(dt); updateBuild(dt);
  ribN = 0;
  if (build.on && build.r < 2500) { trainGeo.instanceCount = 0; nearTrain = 1e9; }           // trains and beams wait until the city stands
  else { updateTrains(worldT, px, P.pos.y, pz); updateBeams(worldT); }
  updateFx(rdt);
  ribGeo.instanceCount = ribN;
  for (const k in ribGeo.attributes) if (ribGeo.attributes[k].isInstancedBufferAttribute) ribGeo.attributes[k].needsUpdate = true;

  U.uTime.value = worldT; U.uRTime.value = realT; U.uBoost.value = P.boost; U.uSlow.value = Math.max(P.slow, 1 - Math.min(1, Math.abs(timeRate)));   // a world that holds still hangs its drops like bullet time
  U.uCamVel.value.copy(P.vel).multiplyScalar(vs);
  const alt = P.pos.y;
  U.uCloud.value = damp(U.uCloud.value, cloudAt(P.pos.x, alt, P.pos.z), 5, rdt);          // how deep in cloud the camera is
  U.uAbove.value = smooth(CLOUD_Y + 60, DECK_TOP - 40, alt);
  U.uRainK.value = (1 - smooth(CLOUD_Y - 70, CLOUD_Y + 20, alt)) * (build.on ? smooth(500, 1500, build.r) : 1);   // rain falls from the cloud base, once there is a city to fall on
  const fa = fogAlt === null ? alt : fogAlt;
  U.uFogFar.value = lerp(FOG_FAR, 3900, smooth(140, 900, fa)); U.uFogDen.value = lerp(0.0009, 0.00013, smooth(100, 1100, fa));
  const near = lerp(0.5, 10, smooth(800, 1600, alt));
  if (Math.abs(near - camera.near) > 0.01) { camera.near = near; camera.updateProjectionMatrix(); }
  U.uNF.value.set(camera.near, camera.far);
  matRain.uniforms.uRainT.value = rainT; matRain.uniforms.uRainScale.value = lerp(1, 0.012, P.slow) * timeRate;
  matGround.uniforms.uCenter.value.set(Math.round(px / CELL) * CELL, Math.round(pz / CELL) * CELL);
  const cu = matComp.uniforms, sn = Math.min(1.7, P.speed * vs / MACH), hf = camera.fov * Math.PI / 180;
  cu.uTime.value = realT; cu.uSpeedN.value = sn * smooth(0.05, 0.35, sn);
  cu.uTrail.value = 0.55 * P.slow;
  cu.uRot.value.set(clamp(P.yawRate * rdt * 0.25 / (hf * camera.aspect), -0.05, 0.05), clamp(-P.pitchRate * rdt * 0.25 / hf, -0.05, 0.05));
  fu.uScan.value = fx.scan; fu.uTear.value = fx.tear; fu.uCA.value = fx.ca + 0.0012 * P.boost + 0.0015 * P.slow;
  fade = started ? Math.min(1, fade + rdt / 2.4) : 0; fu.uFade.value = fade * fade * (3 - 2 * fade);
  renderScene();
  updateAudio(rdt);
}

addEventListener('resize', resize);
resize(); resetCity(); placeStart(); resetTraffic(P.pos.x, P.pos.z); refreshUI();
startBuild(P.pos.x, P.pos.z, 0); build.auto = true;               // nothing stands until the intro ends
requestAnimationFrame(frame);

// ───────────────────────── scripted tours ─────────────────────────
// ?tour=film or ?tour=reel loads tour.js and runs it inside this module, so the tour can drive the camera and the world
{
  const m = /[?&]tour=([a-z]+)/.exec(location.search);
  if (m) fetch('tour.js', { cache: 'no-store' }).then(r => r.text()).then(src => { window.__tourDef = { scene: m[1] }; eval(src); });
}
</script>
</body>
</html>
