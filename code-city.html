<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CODE CITY</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#39ff7a;
    font:12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    -webkit-user-select:none;user-select:none;touch-action:none;letter-spacing:.06em}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  #ui{position:fixed;inset:0;pointer-events:none;transition:opacity .35s;text-shadow:0 0 7px rgba(57,255,122,.6)}
  #ui.hidden{opacity:0}
  #ui.hidden *{pointer-events:none!important}
  #stats{position:absolute;left:14px;top:12px;white-space:pre}
  #toggles{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  #toggles button,#tbtns button{pointer-events:auto;background:rgba(0,14,5,.5);border:1px solid rgba(57,255,122,.35);
    color:inherit;font:inherit;letter-spacing:inherit;text-shadow:inherit;padding:3px 9px;cursor:pointer;border-radius:0}
  #toggles button:hover{background:rgba(57,255,122,.16)}
  #hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;padding:0 16px;opacity:.92;transition:opacity 1.6s}
  #hint.fade{opacity:0}
  #intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;
    font-size:clamp(18px,2.6vw,30px);transition:opacity 1.9s ease;z-index:5;text-shadow:0 0 12px rgba(57,255,122,.8)}
  #intro.gone{opacity:0;pointer-events:none}
  #introbox{width:11ch;white-space:pre}
  #cursor{display:inline-block;width:.6em;height:1.05em;background:#39ff7a;margin-left:.1em;vertical-align:-.16em;
    animation:blink .9s steps(1) infinite;box-shadow:0 0 12px #39ff7a}
  @keyframes blink{50%{opacity:0}}
  #touch{display:none}
  .touch #touch{display:block}
  .touch #hint{bottom:auto;top:12px;left:150px;right:170px}
  #stick{position:fixed;left:26px;bottom:26px;width:120px;height:120px;border:1px solid rgba(57,255,122,.35);
    border-radius:50%;pointer-events:auto;background:rgba(0,20,6,.25)}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;
    background:rgba(57,255,122,.3);border:1px solid rgba(57,255,122,.6)}
  #tbtns{position:fixed;right:20px;bottom:30px;display:flex;flex-direction:column;gap:10px}
  #tbtns button{width:78px;height:44px}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:#000;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="stats"></div>
  <div id="toggles">
    <button id="tRain"></button>
    <button id="tTraffic"></button>
    <button id="tGlitch"></button>
    <button id="tCode"></button>
  </div>
  <div id="hint">WASD move &middot; MOUSE look (click) &middot; SPACE launch &middot; SHIFT boost &middot; Q/E down/up &middot; F bullet-time &middot; G recompile &middot; C cinematic &middot; R new seed &middot; H hide UI</div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="tbtns"><button id="bBoost">BOOST</button><button id="bTime">TIME</button><button id="bCine">CINE</button></div>
  </div>
</div>
<div id="intro"><div id="introbox"><span id="typed"></span><span id="cursor"></span></div></div>
<div id="err">This needs WebGL2. Try a current Chrome, Edge, Firefox or Safari.</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

// ───────────────────────── constants + helpers ─────────────────────────
const CELL = 100, ROAD = 24, ASPH = 16;          // road pitch, right-of-way, asphalt width
const CHUNK_CELLS = 2, CHUNK = CELL * CHUNK_CELLS;
const RC = 6;                                     // chunk radius around the camera
const FOG_FAR = 1150;                             // everything is fully fogged before the load edge
const CLOUD_Y = 620;                              // cloud deck altitude
const MACH = 340;                                 // boost top speed, units (metres) per second
const CEIL = 3200;                                // flight ceiling
const FAR_R = 44, FAR_SNAP = 8;                   // far-field radius and re-centre step, in cells
const SPIRE_GRID = 18;                            // one landmark spire at most per 18 x 18 cells
let EPOCH = 0;                                    // generation of the city; a recompile wave moves it forward
const TAU = Math.PI * 2;

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const $ = id => document.getElementById(id);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashInt(a, b, c) {
  let h = Math.imul(a | 0, 0x9E3779B1) ^ Math.imul(b | 0, 0x85EBCA77) ^ Math.imul(c | 0, 0xC2B2AE3D);
  h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; h = Math.imul(h, 0x297A2D39); h ^= h >>> 15;
  return h >>> 0;
}
const hash01 = (a, b, c) => hashInt(a, b, c) / 4294967296;

// ───────────────────────── seed + settings ─────────────────────────
let SEED = (() => {
  const m = /seed=([0-9a-f]{1,8})/i.exec(location.hash);
  return m ? parseInt(m[1], 16) >>> 0 : (Math.random() * 4294967296) >>> 0;
})();
const seedHex = () => SEED.toString(16).toUpperCase().padStart(8, '0');

const GLITCH_NAMES = ['OFF', 'LOW', 'MED', 'HIGH'], GLITCH_GAP = [1e9, 13, 6.5, 2.6];
const CODE_NAMES = ['LOW', 'MED', 'HIGH'], CODE_MUL = [0.45, 1.0, 1.9];
const S = { rain: true, traffic: true, glitch: 2, code: 1 };

// smooth value noise over cell coordinates, used for district height and style
function vnoise(x, z, salt) {
  const xi = Math.floor(x), zi = Math.floor(z);
  let fx = x - xi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  const s = SEED ^ salt;
  const a = hash01(s, xi, zi), b = hash01(s, xi + 1, zi), c = hash01(s, xi, zi + 1), d = hash01(s, xi + 1, zi + 1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fz);
}

// ───────────────────────── glyph atlas (8x8, mirrored like the film) ─────────────────────────
function makeGlyphAtlas(maxAniso) {
  const N = 8, C = 64, cv = document.createElement('canvas');
  cv.width = cv.height = N * C;
  const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
  const kata = 'ｦｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾜ';
  const chars = (kata + '0123456789:.=*+-<>|"').slice(0, N * N).padEnd(N * N, '7');
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 46px "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","MS Gothic","Noto Sans Mono CJK JP","Noto Sans JP",monospace';
  for (let i = 0; i < N * N; i++) {
    const ch = chars[i], cx = (i % N + 0.5) * C, cy = (Math.floor(i / N) + 0.5) * C;
    const w = Math.max(8, g.measureText(ch).width), sx = clamp(40 / w, 0.7, 1.7);
    g.save(); g.translate(cx, cy + 2); g.scale(-sx, 1); g.fillText(ch, 0, 0); g.restore();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true; tex.anisotropy = Math.min(8, maxAniso);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

// ───────────────────────── renderer + shared uniforms ─────────────────────────
const canvas = $('gl');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
} catch (e) { /* handled below */ }
if (!renderer || !renderer.capabilities.isWebGL2) { $('err').style.display = 'flex'; throw new Error('WebGL2 required'); }
renderer.autoClear = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // the final pass encodes
renderer.toneMapping = THREE.NoToneMapping;               // ACES runs in the composite pass
const HDR = (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'))
  ? THREE.HalfFloatType : THREE.UnsignedByteType;
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
if (IS_TOUCH) {
  document.body.classList.add('touch');
  $('hint').textContent = 'STICK move \u00b7 DRAG look \u00b7 BOOST \u00b7 TIME bullet-time \u00b7 CINE cinematic';
}

const U = {
  uTime: { value: 0 }, uRTime: { value: 0 }, uMirror: { value: 1 },
  uFogCol: { value: new THREE.Vector3(0.010, 0.040, 0.021) },
  uFogDen: { value: 0.0009 }, uFogH: { value: 0.0022 }, uFogFar: { value: FOG_FAR },
  uCloud: { value: 0 }, uFlash: { value: 0 }, uFlashDir: { value: new THREE.Vector3(0.5, 0.6, 0.3).normalize() },
  uGlyph: { value: makeGlyphAtlas(renderer.capabilities.getMaxAnisotropy()) },
  uCode: { value: 1 },
  uGlitchA: { value: new THREE.Vector4(1e9, 1e9, 0, 0) }, uGlitchB: { value: new THREE.Vector4(1e9, 1e9, 0, 0) },
  uRes: { value: new THREE.Vector2(1, 1) }, uRefl: { value: null },
  uCamVel: { value: new THREE.Vector3() }, uBoost: { value: 0 }, uSlow: { value: 0 },
  uAbove: { value: 0 }, uFlashPos: { value: new THREE.Vector3() }, uSeed: { value: new THREE.Vector2() },
  uNear: { value: new THREE.Vector4() }, uWave: { value: new THREE.Vector4(1, 0, 0, 0) },
};
const mkMat = (vs, fs, extra, opts) => new THREE.ShaderMaterial(Object.assign({
  uniforms: Object.assign({}, U, extra || {}), vertexShader: GL_COMMON + vs, fragmentShader: GL_COMMON + fs,
}, opts || {}));

// ───────────────────────── GLSL shared by every scene shader ─────────────────────────
const GL_COMMON = /* glsl */`
uniform float uTime, uRTime, uMirror, uFogDen, uFogH, uFogFar, uCloud, uFlash, uCode, uBoost, uSlow, uAbove;
uniform vec3 uFogCol, uFlashDir, uCamVel, uFlashPos;
uniform vec2 uSeed;
uniform vec4 uWave;                                 // recompile front: direction x, z, position along it, active
const float CLOUD_Y = 620.0, DECK = 680.0;          // cloud base, and the plane the deck is drawn on when seen from above
uniform sampler2D uGlyph;
float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 h22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }

// sky colour by ray height. The horizon equals the fog colour, so the far fade has no seam.
vec3 skyGrad(float y){
  vec3 g = mix(uFogCol, uFogCol * 0.30, smoothstep(0.0, 0.75, y));
  vec3 hi = mix(uFogCol * 0.85, vec3(0.0012, 0.0035, 0.0028), smoothstep(-0.04, 0.4, y));   // above the deck: thin air, dark zenith
  g = mix(g, hi, uAbove);
  return mix(g, uFogCol * 1.5, uCloud) * (1.0 + uFlash * 1.3 * (1.0 - uAbove));
}
// the same integer hash as hashInt() in the script, so shaders can find what the generator decided
float ih01(uint s, int x, int z){
  uint h = (s * 0x9E3779B1u) ^ (uint(x) * 0x85EBCA77u) ^ (uint(z) * 0xC2B2AE3Du);
  h ^= h >> 15; h *= 0x2C1B3C6Du; h ^= h >> 12; h *= 0x297A2D39u; h ^= h >> 15;
  return float(h >> 8) / 16777216.0;
}
// how unfinished the simulation is at a point, 0..1 (c = position in cells)
float unfAt(vec2 c){
  vec2 q = c / 12.0 + vec2(3.0, -11.0), i = floor(q), f = fract(q); f = f * f * (3.0 - 2.0 * f);
  uint s = ((uint(uSeed.x) << 16) | uint(uSeed.y)) ^ 0xE4u;
  int xi = int(i.x), zi = int(i.y);
  float n = mix(mix(ih01(s, xi, zi), ih01(s, xi + 1, zi), f.x), mix(ih01(s, xi, zi + 1), ih01(s, xi + 1, zi + 1), f.x), f.y);
  return smoothstep(0.83, 0.88, n);
}
// the cloud deck from above: coverage at a point of the deck plane, t = distance along the view ray
float deckCover(vec2 c, float t){
  vec2 q = c * 0.00085 + uTime * vec2(0.004, 0.0015);
  float n = fbm(q) * 0.72 + fbm(q * 3.1 + 7.0) * 0.28;
  return mix(smoothstep(0.43, 0.63, n), 0.7, smoothstep(5000.0, 16000.0, t));
}
vec3 sceneLight(vec3 n, float y){
  return uFogCol * (1.4 + 2.6 * (n.y * 0.5 + 0.5))
       + vec3(0.55, 1.0, 0.38) * exp(-max(y, 0.0) / 14.0) * 0.09
       + vec3(0.75, 1.0, 0.9) * uFlash * (0.2 + 0.8 * max(dot(n, uFlashDir), 0.0));
}
// distance fog + ground mist (exponential height fog) + hard fade before the chunk edge
vec3 applyFog(vec3 col, vec3 wp){
  vec3 rd = wp - cameraPosition; float d = length(rd); rd /= max(d, 1e-4);
  const float b = 0.018;
  float k = rd.y * uMirror * b;
  float f = abs(k) < 1e-5 ? d : (1.0 - exp(-d * k)) / k;
  float od = uFogDen * d + uFogH * exp(-abs(cameraPosition.y) * b) * f + uCloud * d * 0.03;
  float fog = 1.0 - exp(-od);
  fog = max(fog, smoothstep(uFogFar * 0.6, uFogFar, d));
  if (cameraPosition.y < CLOUD_Y) fog = max(fog, smoothstep(CLOUD_Y - 70.0, CLOUD_Y - 5.0, wp.y));   // what stands in the deck is hidden from below
  col = mix(col, skyGrad(rd.y), fog);
  if (uAbove > 0.0 && wp.y < DECK && rd.y < -1e-3) {             // looking down through the deck
    float t = (DECK - cameraPosition.y) / rd.y;
    vec2 c = cameraPosition.xz + rd.xz * t;
    float cov = deckCover(c, t);
    float op = 1.0 - pow(1.0 - cov * 0.97, 0.6 / max(-rd.y, 0.1));
    float bil = fbm(c * 0.0052 + 3.0), lit2 = cov - deckCover(c + vec2(-90.0, 180.0), t);          // the side that faces the moon is brighter
    vec3 cc = vec3(0.024, 0.052, 0.042) * (0.35 + 1.1 * bil + 2.2 * max(lit2, 0.0) + 0.5 * cov) + uFogCol * 2.4 * (1.0 - cov);   // moonlit tops, city glow in the thin parts
    vec2 fd = c - uFlashPos.xz;
    cc += vec3(0.5, 1.0, 0.75) * uFlash * (0.05 + 1.6 * exp(-dot(fd, fd) / 9.0e5)) * (0.4 + bil);  // lightning inside the deck
    cc = mix(cc, skyGrad(rd.y), 1.0 - exp(-t * 0.00009));
    col = mix(col, cc, op * uAbove);
  }
  return col;
}
// one glyph from the 8x8 atlas. cuv is 0..1 inside the cell, gradients are passed in so cell edges do not break mip selection.
float glyph(vec2 cuv, float idx, vec2 ddx, vec2 ddy){
  idx = floor(mod(idx, 64.0));
  vec2 g = vec2(mod(idx, 8.0), floor(idx / 8.0));
  return textureGrad(uGlyph, (g + clamp(cuv, 0.03, 0.97)) / 8.0, ddx / 8.0, ddy / 8.0).r;
}
// falling code on a surface. p = metres (across, down). Returns (brightness, head glyph).
vec2 codeRain(vec2 p, float seed, float density, vec2 dpx, vec2 dpy){
  const vec2 gs = vec2(1.3, 1.65);
  vec2 c = p / gs, id = floor(c), f = fract(c);
  float h1 = h21(vec2(id.x, seed * 91.7));
  if (h1 > density) return vec2(0.0);
  float h2 = h21(vec2(id.x + 3.1, seed * 37.3)), h3 = h21(vec2(id.x * 1.7 + 9.2, seed * 53.9));
  float len = mix(16.0, 48.0, h2);
  float t = uTime * mix(5.0, 17.0, h3) + h2 * 97.0;
  float d = mod(t - id.y, len);                       // rows behind the leading glyph
  float br = max(0.0, 1.0 - d / mix(8.0, 28.0, h3)); br *= br;
  float head = step(d, 1.0);
  float chg = floor(uTime * mix(1.2, 4.5, h21(id + seed)) + h21(id * 1.3 + seed) * 10.0);
  float gi = floor(h21(id + vec2(chg * 7.13, seed * 13.7)) * 64.0);
  float g = glyph(vec2(f.x, 1.0 - f.y), gi, vec2(dpx.x, -dpx.y) / gs, vec2(dpy.x, -dpy.y) / gs);
  return vec2(g * (br * 0.9 + head * 1.5), g * head);
}
`;

// ───────────────────────── buildings: instanced boxes ─────────────────────────
const BOX_VS = /* glsl */`
attribute vec3 iPos; attribute vec3 iSize; attribute vec4 iPar; attribute vec3 iBld;   // iBld = building centre x, z + wave flag
uniform vec4 uGlitchA, uGlitchB, uNear;
varying vec3 vWP; varying vec3 vL; varying vec3 vN; varying vec3 vSize; varying vec4 vPar; varying float vG; varying float vWv;
void main(){
  vec3 lp = position * iSize;
  vec3 wp = lp + iPos;
  float g = 0.0, wv = 0.0;
#ifdef FAR
  if (iPos.x > uNear.x && iPos.x < uNear.z && iPos.z > uNear.y && iPos.z < uNear.w) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
#else
  vec2 da = iBld.xy - uGlitchA.xy, db = iBld.xy - uGlitchB.xy;
  if (dot(da, da) < 1.0) g = uGlitchA.z;
  if (dot(db, db) < 1.0) g = max(g, uGlitchB.z);
#endif
  if (iPar.w > 7.5) wp.y += sin(uTime * 0.7 + iPar.x * 40.0) * 2.5;          // floating block
  if (uWave.w > 0.5 && iBld.z != 0.0) {                                      // recompile wave: the old shape sinks, the new one rises
    float dF = dot(iBld.xy, uWave.xy) - uWave.z;                             // > 0: the front has not arrived yet
    if (dF * iBld.z > 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    float a = abs(dF), sc = smoothstep(0.0, 46.0, a);
    wp.y *= sc; lp.y *= sc;
    wv = 1.0 - smoothstep(0.0, 150.0, a);
    g = max(g, (1.0 - smoothstep(10.0, 75.0, a)) * 0.8);
  }
  vWv = wv;
  if (g > 0.0) {
    float band = floor(wp.y * 0.12 + uRTime * 14.0);
    wp.x += (h11(band + iPar.x * 31.0) - 0.5) * 3.0 * g * step(0.6, h11(band * 1.7));
    wp.z += (h11(band + 7.7) - 0.5) * 3.0 * g * step(0.7, h11(band * 2.3));
  }
  vWP = wp; vL = lp; vN = normal; vSize = iSize; vPar = iPar; vG = g;
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}`;

const BOX_FS = /* glsl */`
varying vec3 vWP; varying vec3 vL; varying vec3 vN; varying vec3 vSize; varying vec4 vPar; varying float vG; varying float vWv;
void main(){
  bool front = gl_FrontFacing; if (uMirror < 0.0) front = !front;
  if (!front && vG < 0.004 && vPar.y < 2.5) discard;
  vec3 n = normalize(vN);
  vec3 toCam = cameraPosition - vWP; float dist = length(toCam); vec3 V = toCam / dist;
  float seed = vPar.x, style = vPar.y, codeAmt = vPar.z, kind = vPar.w;
  float H = vSize.y;
  bool roof = n.y > 0.5, xface = abs(n.x) > 0.5;
  float faceW = xface ? vSize.z : vSize.x;
  float u = (xface ? vL.z : vL.x) + faceW * 0.5, v = vL.y;
  float fseed = seed + (xface ? 0.37 : 0.0) + (n.x + n.z > 0.0 ? 0.11 : 0.0);
  float fres = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 4.0);
  vec3 light = sceneLight(n, vWP.y);
  vec3 col = vec3(0.05), emis = vec3(0.0);
  float bw = 4.0, fh = 4.0; vec2 f = vec2(0.5);

  if (kind > 3.5 && kind < 4.5) {                     // train car: dark shell, one band of lit windows, lamps at both ends
    col = vec3(0.03, 0.034, 0.03);
    if (faceW > 6.0 && !roof) {
      vec2 wq = vec2(fract(u / 1.9), (v - 1.3) / 1.15);
      float w = step(0.12, wq.x) * step(wq.x, 0.88) * step(0.0, wq.y) * step(wq.y, 1.0);

      emis += vec3(0.3, 1.0, 0.5) * 0.9 * step(abs(v - 0.55), 0.06);
    } else if (!roof) {
      emis += vec3(0.8, 1.0, 0.85) * 3.0 * exp(-dot(vec2(abs(u - faceW * 0.5) - 0.9, v - 1.0), vec2(abs(u - faceW * 0.5) - 0.9, v - 1.0)) * 9.0);
    }
    emis += skyGrad(0.3) * (0.4 + fres * 2.0);
  } else if (kind > 4.5 && kind < 5.5) {              // viaduct: concrete deck, a light strip underneath, glowing rails
    col = vec3(0.055) * (0.6 + 0.6 * vn(vWP.xz * 0.7));
    float across = xface ? 0.0 : abs(vL.x), along = vL.z;
    if (vSize.x > vSize.z) { across = abs(vL.z); along = vL.x; }
    if (n.y < -0.5) emis += vec3(0.5, 1.0, 0.6) * 1.3 * step(across, 0.14) * step(0.25, fract(along / 6.0));
    else if (roof) emis += vec3(0.25, 1.0, 0.45) * 0.8 * step(abs(across - 1.5), 0.08);
    else emis += vec3(0.25, 1.0, 0.45) * 0.5 * step(abs(v - vSize.y * 0.5), 0.07);

  } else if (kind > 5.5 && kind < 7.5) {              // glyph signs: a blade on a facade (6) or a screen on a roof (7)
    col = vec3(0.02);
    if (!roof && n.y > -0.5 && faceW > 1.0) {
      float cs = kind < 6.5 ? faceW : 1.7;
      vec2 gp = vec2(u, H - v), c = gp / cs, id = floor(c), f2 = fract(c);
      if (kind > 6.5) { float sp = (h11(id.y * 7.3 + seed * 5.0) - 0.5) * 3.0; c.x += uTime * sp; id = floor(c); f2 = fract(c); }
      float chg = floor(uTime * (0.25 + 0.7 * h21(id + seed)) + h21(id * 1.7 + seed) * 9.0);
      float gl = glyph(vec2(f2.x, 1.0 - f2.y), floor(h21(id + vec2(chg * 3.1, seed * 19.0)) * 64.0), dFdx(gp) / cs * vec2(1.0, -1.0), dFdy(gp) / cs * vec2(1.0, -1.0));
      float on = kind < 6.5 ? 1.0 : step(0.35, h21(id + floor(uTime * 0.6 + seed * 7.0)));
      float flick = 1.0 - 0.7 * step(0.93, h11(seed * 77.0)) * step(0.5, fract(uTime * 7.0 + seed));
      vec3 sc = mix(vec3(0.2, 1.0, 0.42), vec3(0.85, 1.0, 0.8), step(0.7, h11(seed * 13.0)));
      float farK = 1.0 - smoothstep(0.3, 1.2, max(fwidth(c.x), fwidth(c.y)));
      emis += sc * flick * (mix(0.3, gl * 2.6, farK) * on + 0.12);
      float bx = min(min(u, faceW - u), min(v, H - v));
      emis += sc * 0.9 * (1.0 - smoothstep(0.0, 0.12, bx)) * flick;
    }
  } else if (kind > 1.5 && kind < 3.5) {              // roof props, poles, antennas
    col = vec3(0.06, 0.07, 0.062) * (0.6 + 0.8 * vn(vec2(u, v) * 1.3 + seed * 40.0));
    emis += skyGrad(0.3) * (0.5 + fres * 2.5);
  } else if (style > 2.5) {                           // unfinished: no textures yet, some facades never loaded
    vec3 hs = vSize * 0.5, e = hs - vec3(abs(vL.x), abs(vL.y - hs.y), abs(vL.z));
    float ed = abs(n.y) > 0.5 ? min(e.x, e.z) : (xface ? min(e.y, e.z) : min(e.x, e.y));
    float wire = (1.0 - smoothstep(0.0, 0.14 + min(dist, 700.0) * 0.0022, ed)) * (1.0 - 0.6 * smoothstep(500.0, 2500.0, dist));
    vec2 g2 = abs(n.y) > 0.5 ? vL.xz : vec2(u, v);
    vec2 gq = abs(fract(g2 / 4.0) - 0.5);
    float gridl = (1.0 - smoothstep(0.0, 0.02 + dist * 0.0006, 0.5 - max(gq.x, gq.y))) * (1.0 - smoothstep(150.0, 500.0, dist));
    float chk = mod(floor(g2.x / 4.0) + floor(g2.y / 4.0), 2.0);
    float miss = step(h21(vec2(dot(n, vec3(1.0, 2.0, 3.0)), seed * 91.0)), 0.38);

    vec2 fw = fwidth(c);
    float lod = smoothstep(0.22, 0.75, max(fw.x, fw.y));
    vec2 aa = fw * 1.2 + 0.002;
    vec2 p = vec2(u, H - v), dpx = dFdx(p), dpy = dFdy(p);
    float win, pLit; vec3 wall;
    if (pod > 0.5) {                                  // street-level shopfronts

          * smoothstep(0.08, 0.08 + aa.y, f.y) * smoothstep(0.14, 0.14 + aa.y, 1.0 - f.y);

    vec3 wc = mix(vec3(0.32, 1.0, 0.48), vec3(0.82, 1.0, 0.7), h21(id + fseed * 5.1));
    vec3 R = reflect(-V, n);

    glass += vec3(0.3, 1.0, 0.45) * 0.25 * (1.0 - lod)
           * step(0.988, h21(floor(vec2(u * 0.8 + (V.x + V.z) * 30.0, v * 0.45 + V.y * 30.0)) + fseed));

  if (vG > 0.004) {                                   // glitch: slices of the building become wireframe + code

}`;

// ───────────────────────── roof cylinders: tanks, stacks, spires ─────────────────────────
const CYL_VS = /* glsl */`
attribute vec3 iPos; attribute vec3 iSize; attribute vec4 iPar; attribute vec3 iBld;
uniform vec4 uGlitchA, uGlitchB;
varying vec3 vWP; varying vec3 vN; varying vec4 vPar; varying float vG; varying float vT;
void main(){
  float t = position.y, r = mix(1.0, iPar.y, t);
  vec3 wp = vec3(position.x * iSize.x * r, t * iSize.y, position.z * iSize.z * r) + iPos;
  vec2 da = iBld.xy - uGlitchA.xy, db = iBld.xy - uGlitchB.xy;
  float g = 0.0;
  if (dot(da, da) < 1.0) g = uGlitchA.z;
  if (dot(db, db) < 1.0) g = max(g, uGlitchB.z);
  if (uWave.w > 0.5 && iBld.z != 0.0) {
    float dF = dot(iBld.xy, uWave.xy) - uWave.z;
    if (dF * iBld.z > 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    wp.y *= smoothstep(0.0, 46.0, abs(dF));
    g = max(g, (1.0 - smoothstep(10.0, 75.0, abs(dF))) * 0.8);
  }
  vWP = wp; vPar = iPar; vG = g; vT = t;
  vN = normalize(vec3(normal.x, normal.y + (1.0 - iPar.y) * iSize.x / iSize.y, normal.z));
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}`;
const CYL_FS = /* glsl */`
varying vec3 vWP; varying vec3 vN; varying vec4 vPar; varying float vG; varying float vT;
void main(){

  if (!front) discard;
  if (vG > 0.004 && h21(vec2(floor(vWP.y * 0.45 + uRTime * 9.0), floor(uRTime * 20.0))) < vG * 1.3) discard;
  vec3 n = normalize(vN), V = normalize(cameraPosition - vWP);
  float fres = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.0);
  vec3 col = vec3(0.07, 0.08, 0.072);
  if (vPar.z < 0.5) col *= 0.65 + 0.5 * step(0.5, fract(vT * 5.0));                       // banded water tank
  else if (vPar.z < 1.5) col = vec3(0.09) * (0.6 + 0.6 * step(0.5, fract(vT * 12.0)) * step(0.78, vT)); // striped stack
  gl_FragColor = vec4(applyFog(col * sceneLight(n, vWP.y) + skyGrad(0.3) * (0.4 + fres * 2.6), vWP), 1.0);
}`;

// ───────────────────────── wet ground: roads, puddles, ripples, planar reflection ─────────────────────────
const GROUND_VS = /* glsl */`
uniform vec2 uCenter;
varying vec3 vWP;
void main(){

  gl_Position = projectionMatrix * viewMatrix * vec4(vWP, 1.0);

// paint for one road. a = distance from its centreline, s = along it, o = distance from the crossing road's centreline
float marks(float a, float s, float o){
  if (o < 12.5 || a > 7.9) return 0.0;
  float m = step(abs(a - 0.22), 0.07) + step(abs(a - 4.0), 0.07) * step(fract(s / 9.0), 0.42);
  m += step(abs(o - 14.6), 1.5) * step(fract(a / 1.3), 0.5);     // zebra crossing

float lampPool(vec2 lat_along, float side, float first){

  float gloss = mix(mix(0.3, 0.5, asph), 1.0, pud);
  vec2 nrm = (vec2(vn(p * 1.9 + 7.0), vn(p * 1.9 + 91.0)) - 0.5) * (1.0 - gloss) * 0.5;
  float near = 1.0 - smoothstep(30.0, 120.0, dist);

  outc += extra + lamp * (exp(-dRoad * 0.1) * (1.0 - lodG) + 0.3 * lodG) * 0.06 * smoothstep(250.0, 1100.0, dist) * (1.0 - uz);   // from far above the wet streets read as ribbons of light

    vec2 g1 = abs(fract(p) - 0.5), g10 = abs(fract(p / 10.0) - 0.5);
    float l1 = (1.0 - smoothstep(0.0, 0.03 + fwp * 1.2, 0.5 - max(g1.x, g1.y))) * (1.0 - smoothstep(0.12, 0.5, fwp));
    float l10 = (1.0 - smoothstep(0.0, 0.07 + fwp * 1.2, (0.5 - max(g10.x, g10.y)) * 10.0)) * (1.0 - smoothstep(1.5, 6.0, fwp));
    vec3 gcol = vec3(0.2, 1.0, 0.42) * (l1 * 0.16 + l10 * 0.75 + 0.012 + 0.05 * smoothstep(1.5, 6.0, fwp)) + refl * F * 0.25;

}`;

// ───────────────────────── sky: underlit cloud deck + lightning ─────────────────────────
const SKY_VS = /* glsl */`
varying vec3 vDir;
void main(){
  vDir = position;
  vec4 p = projectionMatrix * vec4(mat3(viewMatrix) * position, 1.0);
  gl_Position = p.xyww;
}`;
const SKY_FS = /* glsl */`
varying vec3 vDir;
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }
// above the deck: stars are glyphs, some joined into constellations, and the moon is a disc of code
vec3 codeSky(vec3 d){
  vec2 sp = d.xz / (d.y + 0.42) * 9.0 + uTime * vec2(0.003, 0.0);
  vec2 c = sp * 4.0, id = floor(c), f = fract(c);
  float r = h21(id), dens = 0.10 + 0.34 * smoothstep(0.45, 0.72, fbm(sp * 0.33 + 9.0)), st = 0.0;
  if (r < dens) {
    vec2 o = (h22(id + 5.0) - 0.5) * 0.5; float sz = mix(0.16, 0.44, h21(id + 9.0));
    vec2 q = (f - 0.5 - o) / sz + 0.5;
    if (q.x > 0.0 && q.x < 1.0 && q.y > 0.0 && q.y < 1.0)
      st = glyph(q, floor(h21(id + 3.0) * 64.0), dFdx(c) / sz, dFdy(c) / sz) * (0.3 + 0.7 * h21(id + 1.0)) * (0.72 + 0.28 * sin(uRTime * (1.0 + 4.0 * r / dens) + r * 50.0));
  }
  vec2 cc = sp * 0.34 + 3.3, cid = floor(cc), cf = fract(cc); float con = 0.0, node = 0.0;
  if (h21(cid + 17.0) < 0.3) {
    vec2 prev = vec2(0.0); float lw = 0.0025 + fwidth(cc.x) * 1.1;
    for (int i = 0; i < 6; i++) {
      vec2 pt = 0.14 + 0.72 * h22(cid + float(i) * 7.31 + 0.5);
      if (i > 0) con = max(con, 1.0 - smoothstep(0.0, lw, seg(cf, prev, pt)));
      vec2 q = (cf - pt) / 0.06 + 0.5;
      if (q.x > 0.0 && q.x < 1.0 && q.y > 0.0 && q.y < 1.0) node = max(node, glyph(q, floor(h21(cid + float(i)) * 64.0), dFdx(cc) / 0.06, dFdy(cc) / 0.06));
      prev = pt;
    }
  }
  vec3 col = vec3(0.55, 1.0, 0.7) * (st * 0.8 + con * 0.2 + node * 1.5);
  const vec3 M = vec3(0.4082, 0.4082, -0.8165);
  vec3 mu = normalize(cross(M, vec3(0.0, 1.0, 0.0))), mv = cross(mu, M);
  vec2 mp = vec2(dot(d, mu), dot(d, mv)) / 0.105; float mr = length(mp);
  if (dot(d, M) > 0.0) {
    if (mr < 1.0) {
      vec2 gc = mp * 9.0, gid = floor(gc);
      float chg = floor(uTime * (0.3 + h21(gid) * 1.5) + h21(gid + 2.0) * 9.0);
      float g = glyph(vec2(fract(gc.x), 1.0 - fract(gc.y)), floor(h21(gid + chg * 3.7) * 64.0), dFdx(gc), dFdy(gc) * vec2(1.0, -1.0));
      float lim = sqrt(1.0 - mr * mr), phase = smoothstep(-0.55, 0.35, mp.x * 0.8 + mp.y * 0.3 + lim * 0.4);
      col = vec3(0.6, 1.0, 0.75) * (0.05 + g * (0.5 + 1.3 * h21(gid + chg))) * (0.25 + 0.75 * lim) * (0.12 + 0.88 * phase) * 1.6;
    }
    col += vec3(0.4, 1.0, 0.6) * 0.07 * exp(-max(mr - 1.0, 0.0) * 2.2);
  }
  return col * smoothstep(0.0, 0.14, d.y);
}
void main(){
  vec3 d = normalize(vDir);
  vec3 col = skyGrad(d.y);
  vec2 cuv = d.xz / (abs(d.y) + 0.22) * 1.4 + cameraPosition.xz * 0.0006 + uTime * vec2(0.012, 0.004);
  float c = smoothstep(0.35, 0.8, fbm(cuv * 1.5) * 0.75 + fbm(cuv * 4.0 + 5.0) * 0.25);
  float mask = smoothstep(0.02, 0.35, d.y) * (1.0 - uCloud) * (1.0 - uAbove);
  col = mix(col, mix(uFogCol * 0.22, uFogCol * vec3(2.5, 3.0, 2.4), c), mask * 0.85);
  vec3 fd = normalize(vec3(uFlashDir.x, 0.35, uFlashDir.z));
  col += vec3(0.6, 1.0, 0.75) * uFlash * (0.12 + 1.3 * c * exp(-3.0 * distance(d, fd))) * mask;
  col *= max(0.35, 1.0 + uCloud * (fbm(d.xz * 5.0 + d.y * 2.0 + vec2(cameraPosition.y * 0.03, uTime * 0.5)) - 0.47) * 3.2);   // wisps inside the deck
  if (uAbove > 0.0 && d.y > -0.01) col += codeSky(d) * uAbove * (1.0 - uCloud);
  gl_FragColor = vec4(col, 1.0);
}`;

// ───────────────────────── light sprites: lamps, beacons, traffic signals ─────────────────────────
const LIGHT_VS = /* glsl */`
attribute vec3 iPos; attribute vec4 iL; attribute vec3 iB;        // iL = type, size, phase, axis   iB = building centre + wave flag
varying vec2 vUv; varying vec3 vCol;
void main(){
  vec3 c; float it; vec3 lp = iPos;
  if (uWave.w > 0.5 && iB.z != 0.0) {
    float dF = dot(iB.xy, uWave.xy) - uWave.z;
    if (dF * iB.z > 0.0) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
    lp.y *= smoothstep(0.0, 46.0, abs(dF));
  }
  if (iL.x < 0.5) { c = vec3(0.55, 1.0, 0.38); it = 1.7; }                                             // sodium lamp, gone green
  else if (iL.x < 1.5) { c = vec3(0.7, 1.0, 0.8); it = 0.2 + 7.0 * step(0.84, fract(uTime * 0.55 + iL.z)); }  // strobe
  else if (iL.x < 2.5) { float b = 0.5 + 0.5 * sin(uTime * 1.6 + iL.z * 6.2832); c = vec3(1.0, 0.16, 0.1); it = 5.0 * b * b; } // red beacon
  else {                                                                                               // signal, same cycle as the traffic sim
    float ph = fract(iL.z + uTime / 18.0);
    float go = iL.w < 0.5 ? step(ph, 0.45) : step(0.5, ph) * step(ph, 0.95);
    c = mix(vec3(1.0, 0.12, 0.08), vec3(0.2, 1.0, 0.45), go); it = mix(2.0, 3.0, go);
  }
  vec4 mv = viewMatrix * vec4(lp, 1.0);
  float d = length(mv.xyz);
  mv.xy += position.xy * max(iL.y, d * 0.0024);
  gl_Position = projectionMatrix * mv;
  float od = uFogDen * d + uFogH * exp(-abs(cameraPosition.y) * 0.018) * d * 0.45 + uCloud * d * 0.03;
  vCol = c * it * exp(-od * 0.75) * (1.0 - smoothstep(uFogFar * 0.6, uFogFar * 0.95, d));
  if (cameraPosition.y < CLOUD_Y) vCol *= 1.0 - smoothstep(CLOUD_Y - 70.0, CLOUD_Y - 5.0, lp.y);
  if (uAbove > 0.0 && lp.y < DECK) {                              // seen from above: the deck hides most of what is below it
    vec3 rd = normalize(lp - cameraPosition); float t = (DECK - cameraPosition.y) / min(rd.y, -1e-3);
    float cov = deckCover(cameraPosition.xz + rd.xz * t, t);
    vCol *= mix(1.0, pow(1.0 - cov * 0.96, 0.55 / max(-rd.y, 0.1)), uAbove);
  }
  vUv = position.xy;
}`;
const LIGHT_FS = /* glsl */`
varying vec2 vUv; varying vec3 vCol;
void main(){
  float r = length(vUv);
  float a = exp(-r * r * 60.0) + 0.07 * exp(-r * 4.5) * (1.0 - smoothstep(0.7, 1.0, r));
  gl_FragColor = vec4(vCol * a, 1.0);

// double-sided: streak quads face either way, and the mirrored pass flips the winding of every sprite
const ADD = { blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, side: THREE.DoubleSide };
const matBox = mkMat(BOX_VS, BOX_FS, null, { side: THREE.DoubleSide });
const matFar = mkMat(BOX_VS, BOX_FS, null, { side: THREE.DoubleSide, defines: { FAR: 1 } });
const matCyl = mkMat(CYL_VS, CYL_FS, null, { side: THREE.DoubleSide });
const matGround = mkMat(GROUND_VS, GROUND_FS, { uCenter: { value: new THREE.Vector2() }, uReflOn: { value: 1 }, uRainOn: { value: 1 }, uTraffic: { value: 1 } }, { side: THREE.DoubleSide });

// ───────────────────────── rain: streaks that stretch along relative velocity ─────────────────────────
const RAIN_VS = /* glsl */`
attribute vec4 aSeed;
uniform vec3 uRainVel; uniform float uRainT, uRainScale;
varying vec2 vUv; varying float vA;
void main(){
  float far = step(0.5, aSeed.w);
  vec3 B = mix(vec3(44.0, 40.0, 44.0), vec3(150.0, 90.0, 150.0), far);
  float sp = mix(0.85, 1.25, fract(aSeed.w * 7.31));
  vec3 p = aSeed.xyz * B + uRainVel * sp * uRainT;
  p = mod(p - cameraPosition + B * 0.5, B) - B * 0.5 + cameraPosition;      // endless: wrap a box around the camera
  vec3 vel = uRainVel * sp * uRainScale - uCamVel * mix(0.45, 1.0, uBoost);  // what the camera sees (full stretch only under boost)
  vec3 tail = -vel * mix(0.034, 0.06, uBoost);
  float len = length(tail), minLen = mix(0.05, 0.11, uSlow);
  if (len < minLen) { tail = (len > 1e-5 ? tail / len : vec3(0.0, 1.0, 0.0)) * minLen; len = minLen; }
  vec3 a = (viewMatrix * vec4(p, 1.0)).xyz, b = (viewMatrix * vec4(p + tail, 1.0)).xyz;
  vec3 side = cross(b - a, a); side /= max(length(side), 1e-5);
  float d = -a.z;
  float w0 = mix(0.02, 0.036, far) * (1.0 + uSlow * 1.3), w = max(w0, d * 0.0016);
  gl_Position = projectionMatrix * vec4(mix(a, b, position.y) + side * position.x * w, 1.0);
  vUv = vec2(position.x * 2.0, position.y);
  float cd = length(p - cameraPosition);
  vA = smoothstep(1.2, 5.0, d) * (1.0 - smoothstep(B.x * 0.34, B.x * 0.5, cd))
     * (0.13 + 0.06 * far) * (1.0 + 3.5 / (1.0 + d * d * 0.02))            // drops near the camera catch the light
     * sqrt(w0 / w) * mix(clamp(1.5 / len, 0.14, 2.5), 2.2, uSlow) * (1.0 + uFlash * 1.5) * (1.0 - uCloud) * (1.0 - uAbove);
}`;
const RAIN_FS = /* glsl */`
varying vec2 vUv; varying float vA;
void main(){
  float streak = (1.0 - vUv.x * vUv.x) * smoothstep(0.0, 0.12, vUv.y) * mix(1.0, 0.25, vUv.y) * (1.0 - smoothstep(0.7, 1.0, vUv.y));
  float r = length(vec2(vUv.x, vUv.y * 2.0 - 1.0));
  float bead = (1.0 - smoothstep(0.5, 0.95, r)) * (0.22 + 1.6 * exp(-dot(vUv - vec2(0.3, 0.68), vUv - vec2(0.3, 0.68)) * 30.0));   // frozen droplet with a glint
  gl_FragColor = vec4(vec3(0.55, 1.0, 0.7) * mix(streak, bead, uSlow) * vA, 1.0);
}`;

// ───────────────────────── rain: some drops are falling strands of glyphs ─────────────────────────
const GRAIN_VS = /* glsl */`
attribute vec4 aSeed;
uniform float uRainT;
varying vec2 vUv; varying float vA; varying float vS;
void main(){
  const vec3 B = vec3(110.0, 80.0, 110.0);
  vec3 p = aSeed.xyz * B; p.y -= mix(9.0, 20.0, aSeed.w) * uRainT;
  p = mod(p - cameraPosition + B * 0.5, B) - B * 0.5 + cameraPosition;

  vec3 wp = p + right * position.x * gs + vec3(0.0, position.y * gs * 8.75, 0.0);
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);

  vA = smoothstep(0.6, 3.0, d) * (1.0 - smoothstep(38.0, 55.0, d)) * (0.7 + 2.5 / (1.0 + d * d * 0.01)) * (1.0 + uSlow) * (1.0 - uCloud) * (1.0 - uAbove);

const GRAIN_FS = /* glsl */`
uniform float uRainT;
varying vec2 vUv; varying float vA; varying float vS;
void main(){

// ───────────────────────── steam from street vents and stacks ─────────────────────────
const STEAM_VS = /* glsl */`
attribute vec4 aBase; attribute vec4 aRnd;        // aBase = vent xyz + scale, aRnd = phase + three randoms
varying vec2 vUv; varying float vA; varying float vR; varying float vY;
void main(){
  float rate = mix(0.16, 0.26, aRnd.y), tt = uTime * rate + aRnd.x, age = fract(tt), sc = aBase.w;
  vec3 p = aBase.xyz;
  p.y += age * mix(9.0, 16.0, aRnd.z) * sc;
  p.x += (age * age * 5.0 + sin(age * 5.0 + aRnd.w * 6.28) * 0.7) * sc;
  p.z += (age * age * 2.0 + cos(age * 4.0 + aRnd.y * 6.28) * 0.7) * sc;
  vec4 mv = viewMatrix * vec4(p, 1.0);
  mv.xy += position.xy * mix(0.8, 5.5, sqrt(age)) * sc;
  gl_Position = projectionMatrix * mv;
  float d = length(mv.xyz);
  vUv = position.xy; vR = aRnd.w * 50.0 + floor(tt); vY = p.y;
  vA = smoothstep(0.0, 0.12, age) * pow(1.0 - age, 1.5) * 0.32 * smoothstep(1.0, 6.0, d) * (1.0 - smoothstep(360.0, 520.0, d));
}`;
const STEAM_FS = /* glsl */`
varying vec2 vUv; varying float vA; varying float vR; varying float vY;
void main(){

  float n = vn(vUv * 1.7 + vR) * 0.6 + vn(vUv * 3.9 + vR * 1.7) * 0.4;
  float a = (1.0 - r * r) * smoothstep(0.2, 0.75, n + 0.3 * (1.0 - r)) * vA;

  gl_FragColor = vec4(c * a, a);
}`;

// ───────────────────────── traffic: car bodies + headlights, taillights, beams on the road ─────────────────────────
const CAR_COMMON = /* glsl */`
attribute vec4 iCar;            // x, z, heading index (0 +x, 1 -x, 2 +z, 3 -z), seed
attribute float iCarS;          // brake amount
vec2 carFwd(float d){ return d < 0.5 ? vec2(1.0, 0.0) : d < 1.5 ? vec2(-1.0, 0.0) : d < 2.5 ? vec2(0.0, 1.0) : vec2(0.0, -1.0); }
`;
const CAR_VS = CAR_COMMON + /* glsl */`
varying vec3 vWP; varying vec3 vN; varying float vSeed; varying float vLY;
void main(){
  vec2 fw = carFwd(iCar.z), rt = vec2(-fw.y, fw.x);
  vec3 wp = vec3(iCar.x + fw.x * position.z + rt.x * position.x, position.y, iCar.y + fw.y * position.z + rt.y * position.x);
  vN = vec3(fw.x * normal.z + rt.x * normal.x, normal.y, fw.y * normal.z + rt.y * normal.x);

const CAR_FS = /* glsl */`
varying vec3 vWP; varying vec3 vN; varying float vSeed; varying float vLY;

const CARL_VS = CAR_COMMON + /* glsl */`
attribute float aPart;          // 0,1 headlights  2,3 taillights  4 beam on the road  5 tail glow on the road
varying vec2 vUv; varying vec3 vCol; varying float vKind;
void main(){

  vec3 F = vec3(fw.x, 0.0, fw.y), R = vec3(rt.x, 0.0, rt.y), base = vec3(iCar.x, 0.0, iCar.y);
  float head = (aPart < 1.5 || (aPart > 3.5 && aPart < 4.5)) ? 1.0 : 0.0;
  float dc = distance(cameraPosition, base);
  float od = uFogDen * dc + uFogH * exp(-abs(cameraPosition.y) * 0.018) * dc * 0.45 + uCloud * dc * 0.03;
  float att = exp(-od * 0.75) * (1.0 - smoothstep(330.0, 400.0, dc));

    vec4 mv = viewMatrix * vec4(lp, 1.0);
    float size = max(head > 0.5 ? 0.7 + 1.2 * vis : 0.7, length(mv.xyz) * 0.002);
    mv.xy += position.xy * size * vec2(head > 0.5 ? 1.7 : 1.0, 1.0);
    gl_Position = projectionMatrix * mv;
    vCol = (head > 0.5 ? vec3(0.75, 1.0, 0.85) * (0.4 + 3.4 * vis) : vec3(1.0, 0.12, 0.06) * (0.5 + 1.8 * iCarS) * (0.25 + 0.75 * vis)) * att;
    vKind = 0.0;
  } else {
    float t = position.y * 0.5 + 0.5;

    else {

      for (const g of b.segs) rib(g[0], g[1], g[2], g[3], g[4], g[5], g[6] * 1.5, g[6] * 1.5, it * (0.35 + 0.65 * g[6]), 1);
      rib(b.x, b.y - 1.5, b.z, b.x, b.y + 3.5, b.z, 7, 7, it * 0.8, 1);                 // the mast flares where it is hit
    }
  }
  if (S.glitch > 0 && started && !cineOn) {                       // now and then the city recompiles by itself
    fx.nextWave -= rdt;
    if (fx.nextWave <= 0) { fx.nextWave = GLITCH_GAP[S.glitch] * (7 + Math.random() * 6); startWave(); }
  }
}

// ───────────────────────── UI ─────────────────────────
function refreshUI() {
  $('tRain').textContent = '[1] RAIN ' + (S.rain ? 'ON' : 'OFF');
  $('tTraffic').textContent = '[2] TRAFFIC ' + (S.traffic ? 'ON' : 'OFF');
  $('tGlitch').textContent = '[3] GLITCH ' + GLITCH_NAMES[S.glitch];
  $('tCode').textContent = '[4] CODE ' + CODE_NAMES[S.code];
  U.uCode.value = CODE_MUL[S.code]; matGround.uniforms.uRainOn.value = S.rain ? 1 : 0; matGround.uniforms.uTraffic.value = S.traffic ? 1 : 0;
}
function toggle(k) {
  if (k === 'rain') S.rain = !S.rain;
  else if (k === 'traffic') S.traffic = !S.traffic;
  else if (k === 'glitch') { S.glitch = (S.glitch + 1) % 4; fx.nextGlitch = Math.min(fx.nextGlitch, GLITCH_GAP[S.glitch] * 0.5); }
  else S.code = (S.code + 1) % 3;
  refreshUI();
}
for (const [id, k] of [['tRain', 'rain'], ['tTraffic', 'traffic'], ['tGlitch', 'glitch'], ['tCode', 'code']])
  $(id).addEventListener('click', e => { toggle(k); e.currentTarget.blur(); });

// start a few blocks before the tallest district nearby, on a road, flying toward it
function placeStart() {
  let best = -1, bx = 0, bz = 0;
  for (let iz = -10; iz <= 10; iz++) for (let ix = -10; ix <= 10; ix++) {
    const v = vnoise(ix / 5, iz / 5, 0x51); if (v > best) { best = v; bx = ix; bz = iz; }
  }
  const iz = bz - 4, y = clamp(Math.min(getCell(bx, iz).maxH, getCell(bx - 1, iz).maxH) + 14, 40, 300);
  P.pos.set(bx * CELL, y, iz * CELL + 50); P.vel.set(0, 0, 0);
  P.yaw = P._yaw0 = Math.PI; P.pitch = P._pitch0 = 0; P.roll = 0; P.boost = 0;
  camera.position.copy(P.pos); camera.rotation.set(0, P.yaw, 0, 'YXZ');
}
function newSeed() {
  SEED = (Math.random() * 4294967296) >>> 0;
  try { history.replaceState(null, '', '#seed=' + seedHex()); } catch (e) { /* file:// in some browsers */ }
  resetCity(); placeStart(); resetTraffic(P.pos.x, P.pos.z);
  fx.slots[0] = fx.slots[1] = null; fx.scan = 1; fx.tear = 1; fx.ca = 0.008; chirp(6);
  if (cineOn) startCine();
}

// ───────────────────────── intro ─────────────────────────
let started = false, fade = 0;
(async () => {
  const wait = ms => new Promise(r => setTimeout(r, ms)), el = $('typed');
  await wait(900);
  for (const ch of 'wake up...') { el.textContent += ch; await wait(90 + Math.random() * 110); }
  await wait(1300);
  $('intro').classList.add('gone');
  started = true; fx.nextGlitch = 2.8; fx.force = 'dissolve';
  if (!MOVE_KEYS.some(k => keys[k])) setCine(true);              // already flying by hand: leave the controls alone
  setTimeout(() => $('hint').classList.add('fade'), 5000);
})();

// ───────────────────────── main loop ─────────────────────────
let last = performance.now(), worldT = 0, rainT = 0, realT = 0, fpsT = last, fpsN = 0, fps = 60, lowN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = clamp((now - last) / 1000, 0.001, 0.05); last = now;
  realT += rdt; fpsN++;
  if (now - fpsT >= 500) {
    fps = fpsN * 1000 / (now - fpsT); fpsT = now; fpsN = 0;
    $('stats').textContent = `FPS ${fps.toFixed(0)}\nSEED ${seedHex()}\nMACH ${(P.speed / MACH).toFixed(2)}`
      + (cineOn ? '\nCINEMATIC' : '') + (P.slow > 0.5 ? '\nBULLET TIME' : '');
    // hold 60 FPS: if the frame rate stays low, render fewer pixels
    if (started && realT > 8 && !document.hidden && fps < 48) { if (++lowN >= 3 && quality > 0.56) { quality = Math.max(0.55, quality * 0.85); lowN = 0; resize(); } }
    else lowN = 0;
  }
  const fu = matFinal.uniforms;
  fu.uTime.value = realT;
  if (replay.left > 0) {                                          // deja vu: the world holds still while stored frames run again
    fu.uScan.value = 0.55; fu.uCA.value = 0.006; fu.uTear.value = 0;
    renderScene();
    if (replay.left === 0) { fx.scan = 0.6; fx.tear = 0.5; }
    return;
  }
  P.slow = damp(P.slow, (keys.KeyF || touch.slow) ? 1 : 0, 7, rdt);
  const dt = rdt * lerp(1, 0.1, P.slow), cdt = rdt * lerp(1, cineOn ? 0.22 : 0.4, P.slow);   // world at 10%, the flyer keeps some pace
  worldT += dt; rainT += rdt * lerp(1, 0.012, P.slow);                       // rain all but freezes
  if (cineOn) stepCine(cdt, rdt); else stepManual(cdt, rdt);
  const vs = cineOn ? 1 : cdt / rdt;
  P.speed = P.vel.length();
  if (P.boomArmed && P.speed > MACH * 0.92) { P.boomArmed = false; P.shock = 0; sonicBoom(); }
  if (P.speed < MACH * 0.6) P.boomArmed = true;
  P.shock = Math.min(1, P.shock + rdt / 0.9);
  const fovT = 72 + 42 * P.boost * smooth(0.12, 0.9, P.speed / MACH) - 7 * P.slow;
  if (Math.abs(fovT - camera.fov) > 0.02) { camera.fov = damp(camera.fov, fovT, 5, rdt); camera.updateProjectionMatrix(); }
  P.shake = Math.max(0, P.shake - rdt * 1.8);
  const mch = P.speed / MACH, shk = 0.0012 * P.boost + 0.004 * P.boost * Math.exp(-Math.pow((mch - 0.95) / 0.07, 2)) + 0.0025 * U.uCloud.value * Math.min(1, mch * 3) + 0.03 * P.shake * P.shake;
  if (shk > 1e-5) {
    camera.rotateX(shk * (Math.sin(realT * 47.1) + Math.sin(realT * 83.3 + 1.3)));
    camera.rotateY(shk * (Math.sin(realT * 53.7 + 2.1) + Math.sin(realT * 71.9)));
    camera.rotateZ(shk * 0.6 * Math.sin(realT * 39.3 + 0.7));
  }
  camera.updateMatrixWorld();

  const px = P.pos.x, pz = P.pos.z;
  updateChunks(px, pz, started ? 4 : 400);
  updateFar(px, pz);
  updateTraffic(dt, worldT, px, pz, P.vel.x, P.vel.z);
  updateWave(dt);
  ribN = 0;
  updateTrains(worldT, px, P.pos.y, pz);
  updateBeams(worldT, px, pz);
  updateFx(rdt);
  ribGeo.instanceCount = ribN;
  for (const k in ribGeo.attributes) if (ribGeo.attributes[k].isInstancedBufferAttribute) ribGeo.attributes[k].needsUpdate = true;

  U.uTime.value = worldT; U.uRTime.value = realT; U.uBoost.value = P.boost; U.uSlow.value = P.slow;
  U.uCamVel.value.copy(P.vel).multiplyScalar(vs);
  const alt = P.pos.y;
  U.uCloud.value = smooth(CLOUD_Y - 90, CLOUD_Y + 10, alt) * (1 - smooth(CLOUD_Y + 60, CLOUD_Y + 150, alt));
  U.uAbove.value = smooth(CLOUD_Y + 50, CLOUD_Y + 150, alt);
  U.uFogFar.value = lerp(FOG_FAR, 3900, smooth(140, 900, alt)); U.uFogDen.value = lerp(0.0009, 0.00013, smooth(100, 1100, alt));
  const near = lerp(0.5, 10, smooth(800, 1600, alt));
  if (Math.abs(near - camera.near) > 0.01) { camera.near = near; camera.updateProjectionMatrix(); }
  matRain.uniforms.uRainT.value = rainT; matRain.uniforms.uRainScale.value = lerp(1, 0.012, P.slow);
  matGround.uniforms.uCenter.value.set(Math.round(px / CELL) * CELL, Math.round(pz / CELL) * CELL);
  const cu = matComp.uniforms, sn = P.speed * vs / MACH, hf = camera.fov * Math.PI / 180;
  cu.uTime.value = realT; cu.uBoost.value = P.boost * smooth(0.25, 0.9, sn); cu.uSpeedN.value = sn * smooth(0.05, 0.35, sn);
  cu.uShock.value = P.shock; cu.uTrail.value = 0.55 * P.slow;
  cu.uRot.value.set(clamp(P.yawRate * rdt * 0.5 / (hf * camera.aspect), -0.05, 0.05), clamp(-P.pitchRate * rdt * 0.5 / hf, -0.05, 0.05));
  fu.uScan.value = fx.scan; fu.uTear.value = fx.tear; fu.uCA.value = fx.ca + 0.004 * P.boost + 0.0015 * P.slow;
  fade = started ? Math.min(1, fade + rdt / 2.4) : 0; fu.uFade.value = fade * fade * (3 - 2 * fade);
  renderScene();
  updateAudio(rdt);
}

addEventListener('resize', resize);
resize(); resetCity(); placeStart(); resetTraffic(P.pos.x, P.pos.z); refreshUI();
requestAnimationFrame(frame);
</script>
</body>
